<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="robots" content="noindex, nofollow" />
    <title>History — LAN Speed Test</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9889;</text></svg>" />
    <script>
      // Before first paint, so a reader who chose light does not get a flash of
      // the dark palette on every navigation. Inline and tiny for that reason:
      // a module script would run after the page has already been painted.
      try {
        var t = localStorage.getItem('speedtest.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="page">
      <header class="page__head">
        <h1 class="page__title" id="page-title" data-testid="page-title">History</h1>
        <div class="page__actions">
          <button class="theme-toggle" id="theme-toggle" data-testid="theme-toggle" type="button">Light</button>
          <span class="phase" id="count" data-testid="count"></span>
          <select class="select" id="client-filter" data-testid="client-filter" aria-label="Filter by client">
            <option value="all">All clients</option>
          </select>
          <!-- Shown only once runs have been tagged: an empty filter is a
               control that can only be set back to where it already is. -->
          <select class="select" id="location-filter" data-testid="location-filter" aria-label="Filter by location" hidden>
            <option value="all">All locations</option>
          </select>
          <button class="btn" id="rename" data-testid="rename" type="button" hidden>
            Rename client
          </button>
          <a class="btn" href="/">Run a test</a>
        </div>
      </header>

      <p class="error" id="error" data-testid="error" hidden></p>

      <section class="chart" id="chart" data-testid="chart" aria-label="Bandwidth trend"></section>

      <p class="note" id="empty" data-testid="empty" hidden>
        No runs stored yet. Run a test and it will appear here.
      </p>

      <!-- Two runs, then compare them. A bar rather than a dialog: the
           selection is the state, so showing it is showing what will happen. -->
      <div class="cmp__bar" id="compare-bar" data-testid="compare-bar" hidden>
        <span id="compare-count" data-testid="compare-count"></span>
        <a class="btn" id="compare-go" data-testid="compare-go" href="#">Compare</a>
        <button class="btn" id="compare-clear" data-testid="compare-clear" type="button">
          Clear
        </button>
      </div>

      <div class="table-wrap">
        <table class="table" data-testid="table">
          <thead>
            <tr>
              <th scope="col" class="cell--pick"><span class="visually-hidden">Compare</span></th>
              <th scope="col">When</th>
              <th scope="col">Client</th>
              <th scope="col">Location</th>
              <th scope="col" class="cell--num">Download</th>
              <th scope="col" class="cell--num">Upload</th>
              <th scope="col" class="cell--num">Latency</th>
              <th scope="col" class="cell--num">Loaded ↓</th>
              <th scope="col" class="cell--num">Loss</th>
              <th scope="col">Suitability</th>
              <th scope="col">Profile</th>
              <th scope="col">Description</th>
              <th scope="col"><span class="visually-hidden">Result</span></th>
            </tr>
          </thead>
          <tbody id="rows" data-testid="rows"></tbody>
        </table>
      </div>
    </main>

    <script type="module" src="/src/history.ts"></script>
  </body>
</html>
