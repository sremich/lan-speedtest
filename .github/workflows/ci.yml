name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tier 1 — fast, no external systems.
  backend:
    name: Backend (tier 1 + throughput)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: Unit and contract tests
        run: cargo test --manifest-path backend/Cargo.toml --release -- --nocapture
        env:
          # Calibrated against a real run: this backend measured 34.3, 51.5 and
          # 50.6 Gbps over loopback across three passes on a hosted runner
          # (2026-08-24). A 10 Gbps floor leaves ~3x headroom for runner
          # variance while still catching any regression of kind. The local
          # default is far lower because the WSL2 dev box tops out near
          # 0.7 Gbps; see backend/tests/throughput.rs.
          SPEEDTEST_THROUGHPUT_FLOOR_GBPS: "10.0"

  # Tier 1 — the provisioner, against a scripted fake hypervisor.
  provisioning:
    name: Provisioning (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: provisioning/proxmox

      - name: Formatting
        run: cargo fmt --manifest-path provisioning/proxmox/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path provisioning/proxmox/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        # Includes the two properties that matter most: a second run changes
        # nothing, and a guest we did not create is never touched.
        run: cargo test --manifest-path provisioning/proxmox/Cargo.toml

      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck provisioning/coturn/install-coturn.sh

  # Tier 2 — the real engine in a real browser against the real backend.
  e2e:
    name: e2e (tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install front-end dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Front-end unit tests
        working-directory: frontend
        # Pure functions — the percentile maths behind the distribution view,
        # where an off-by-one in interpolation would be invisible in the UI.
        run: npm run test:unit

      - name: Build front end
        working-directory: frontend
        run: npx vite build

      - name: Build backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Run e2e
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Tier 2 — results are stored and shown on the history page.
  history:
    name: History (tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build front end
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Build backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Start backend with history enabled
        env:
          SPEEDTEST_BIND: 127.0.0.1:8099
          SPEEDTEST_CONFIG: config/speedtest.toml
          SPEEDTEST_PROFILE: quick
          SPEEDTEST_STATIC_DIR: frontend/dist
          SPEEDTEST_HISTORY_DB: /tmp/ci-history.db
        run: |
          ./backend/target/release/lan-speedtest > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/api/status

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run history suite
        working-directory: frontend
        env:
          SPEEDTEST_E2E_NO_SERVER: "1"
          SPEEDTEST_E2E_PORT: "8099"
          SPEEDTEST_E2E_HISTORY: "1"
        run: npx playwright test history --project=chromium

      - name: Diagnostics on failure
        if: failure()
        run: cat backend.log || true

  # Tier 2 — the packet-loss stage against a real coturn relay.
  packet-loss:
    name: Packet loss via TURN (tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build front end
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Build backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Start coturn
        run: |
          docker compose -f docker-compose.e2e.yml up -d
          sleep 5
          docker logs speedtest-e2e-coturn

      - name: Start backend with the relay configured
        env:
          SPEEDTEST_BIND: 127.0.0.1:8099
          SPEEDTEST_CONFIG: config/speedtest.toml
          SPEEDTEST_PROFILE: e2e-packetloss
          SPEEDTEST_STATIC_DIR: frontend/dist
          SPEEDTEST_TURN_ENABLED: "true"
          SPEEDTEST_TURN_URI: 127.0.0.1:3478
          SPEEDTEST_TURN_USER: e2e
          SPEEDTEST_TURN_PASS: e2e-not-a-secret
        run: |
          ./backend/target/release/lan-speedtest > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/api/profile | head -c 300

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run packet-loss suite
        working-directory: frontend
        env:
          SPEEDTEST_E2E_NO_SERVER: "1"
          SPEEDTEST_E2E_PORT: "8099"
          SPEEDTEST_E2E_PACKETLOSS: "1"
        run: npx playwright test packetloss --project=chromium

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- backend ---"; cat backend.log || true
          echo "--- coturn ---"; docker logs speedtest-e2e-coturn || true

  # The image has to actually build; the release workflow is not the place to
  # discover that it does not.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" \
            --build-arg GIT_SHA="${GITHUB_SHA::12}" \
            -t speedtest:ci .

      - name: Container serves and reports its build
        run: |
          docker run -d --name speedtest-ci -p 8080:8080 speedtest:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          STATUS="$(curl -fsS http://127.0.0.1:8080/api/status)"
          echo "$STATUS"
          # The version baked into the image must match the VERSION file.
          echo "$STATUS" | grep -q "\"version\":\"$(tr -d '[:space:]' < VERSION)\""
          # The front end must be present, not just the API — every page of it.
          curl -fsS http://127.0.0.1:8080/ | grep -qi "LAN Speed Test"
          curl -fsS http://127.0.0.1:8080/history.html | grep -qi "History"
          # And the engine contract must hold inside the container too.
          curl -fsSD - -o /dev/null "http://127.0.0.1:8080/__down?bytes=1024" \
            | grep -qi "^server-timing: cfRequestDuration;dur="
          docker rm -f speedtest-ci
