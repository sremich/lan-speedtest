# Deploy compose file: pulls the prebuilt image from GHCR.
# RULE: after every release goes green, bump the image tag pin here.

services:
  app:
    image: ghcr.io/sremich/self-hosted-cloudflare-speedtest:v1.5.1
    container_name: speedtest
    restart: unless-stopped
    env_file: .env
    # Host networking: the measurement path should not cross a NAT hop, and
    # coturn runs natively on the same guest. See DECISIONS.md.
    network_mode: host
    # Needed to bind 443 as a non-root user; the binary carries the matching
    # file capability. See the Dockerfile.
    cap_add:
      - NET_BIND_SERVICE
    # The certificate is mounted group-readable by gid 10001. Granting it as a
    # supplementary group works regardless of what primary gid the image's user
    # happens to have, so an image built before the gid was pinned still reads
    # its own certificate.
    group_add:
      - "10001"
    volumes:
      # Bind-mounted so the measurement profile can be retuned and the service
      # restarted without pulling a new image.
      - ./config/speedtest.toml:/app/config/speedtest.toml:ro
      # Certificates are issued and renewed on the host by acme.sh; the renewal
      # hook restarts this service so the new material is picked up.
      - /etc/speedtest/tls:/etc/speedtest/tls:ro
      # Stored run history. Gitignored on the host; survives image updates.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
